[versions]
kotlin = "2.3.21"

[libraries]
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test" }

dokkaPlugin = "org.jetbrains.dokka:dokka-gradle-plugin:2.2.0"
spotlessPlugin = "com.diffplug.spotless:spotless-plugin-gradle:8.6.0"
gradleMavenPublishPlugin = "com.vanniktech:gradle-maven-publish-plugin:0.36.0"
compatPlugin = "com.gradleup.tapmoc:tapmoc-gradle-plugin:0.4.2"
buildConfigPlugin = "com.github.gmazzo.buildconfig:plugin:6.0.9"

junit = "junit:junit:4.13.2"
assertk = "com.willowtreeapps.assertk:assertk:0.28.1"
testParameterInjector = "com.google.testparameterinjector:test-parameter-injector:1.22"
ktlint = "com.pinterest.ktlint:ktlint-cli:1.8.0"

android-gradlePlugin = "com.android.tools.build:gradle:9.0.1"
androidx-gradlePluginLints = "androidx.lint:lint-gradle:1.0.0-rc01"
burst-gradlePlugin = "app.cash.burst:burst-gradle-plugin:2.13.0"
