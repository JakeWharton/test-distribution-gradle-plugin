[versions]
kotlin = "2.4.10"

[libraries]
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit" }

# HEY! If you update the minimum-supported Gradle version check to see if the Kotlin language version or
# Java targets below can be bumped. See https://docs.gradle.org/current/userguide/compatibility.html.
gradle-minimum = "org.gradle.experimental:gradle-public-api:9.1.0"
gradle-v9dot3 = "org.gradle.experimental:gradle-public-api:9.3.0"

dokkaPlugin = "org.jetbrains.dokka:dokka-gradle-plugin:2.2.0"
spotlessPlugin = "com.diffplug.spotless:spotless-plugin-gradle:8.10.1"
gradleMavenPublishPlugin = "com.vanniktech:gradle-maven-publish-plugin:0.37.0"
compatPlugin = "com.gradleup.tapmoc:tapmoc-gradle-plugin:0.4.2"
buildConfigPlugin = "com.github.gmazzo.buildconfig:plugin:6.0.10"

junit4 = "junit:junit:4.13.2"

junitJupiter-engine = "org.junit.jupiter:junit-jupiter-engine:6.1.3"
junitPlatform-console = "org.junit.platform:junit-platform-console:6.1.3"

assertk = "com.willowtreeapps.assertk:assertk:0.28.1"
testParameterInjector = "com.google.testparameterinjector:test-parameter-injector:1.22"
ktlint = "com.pinterest.ktlint:ktlint-cli:1.8.0"

android-gradlePlugin = "com.android.tools.build:gradle:9.0.0"
android-gradlePlugin-minimum = "com.android.tools.build:gradle-api:9.0.0"
android-gradlePlugin-v9dot5 = "com.android.tools.build:gradle-api:9.5.0-alpha02"

androidx-gradlePluginLints = "androidx.lint:lint-gradle:1.0.0"
